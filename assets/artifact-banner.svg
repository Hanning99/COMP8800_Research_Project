    <radialGradient id="glow"><stop stop-color="#52d4c4" stop-opacity=".28"/><stop offset="1" stop-color="#52d4c4" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#d7edf3" stroke-opacity=".055" stroke-width="1"/></pattern>
